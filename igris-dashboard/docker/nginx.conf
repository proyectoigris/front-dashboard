server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Recursos con hash de Vite: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(glb|mp4|webp|png|svg)$ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cuando exista el backend FastAPI (:8000), descomentar y añadir el
    # servicio "backend" en docker-compose.yml:
    # location /api/ { proxy_pass http://backend:8000; }
    # location /ws/  {
    #     proxy_pass http://backend:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
